<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marginal Notes</title>
<meta name="description" content="Interactive economics study kit: the core graphs and equations of micro, macro and international economics.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <button type="button" class="menu-btn" id="menu-btn" aria-controls="sidebar" aria-expanded="false">Topics</button>
  <a class="brand" href="#supply-demand"><span class="brand-mark" aria-hidden="true"></span>Marginal Notes</a>
  <nav class="modes" aria-label="Study mode">
    <a href="#supply-demand" data-mode="graphs">Graphs</a>
    <a href="#formulas" data-mode="sheet">Formula sheet</a>
    <a href="#flashcards" data-mode="cards">Flashcards</a>
  </nav>
  <div class="progress" aria-live="polite">
    <span id="prog-text">0 / 20 mastered</span>
    <div class="bar"><i id="prog-bar"></i></div>
  </div>
</header>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <label class="search" for="search"><span class="visually-hidden">Search topics</span>
      <input type="search" id="search" placeholder="Search topics and formulas" autocomplete="off">
    </label>
    <nav id="topic-nav" aria-label="Topics"></nav>
  </aside>
  <main id="main"></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script src="js/engine.js"></script>
<script src="js/topics.js"></script>
<script src="js/app.js"></script>
</body>
</html>
